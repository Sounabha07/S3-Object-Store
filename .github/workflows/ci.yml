name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, staticcheck, race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test -race
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: S3 integration suite against Raft metadata
        run: S3OS_IT_META=raft go test -race -count=1 ./test/integration
      - name: S3 integration suite against Raft metadata and 6 storage nodes
        run: S3OS_IT_META=raft S3OS_IT_STORAGE=cluster go test -race -count=1 ./test/integration

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: gosec
        run: gosec -exclude-generated ./...

  cluster:
    name: docker-compose cluster smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build and start cluster
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 120
      - name: show status
        if: always()
        run: docker compose -f deploy/docker-compose.yml ps
      - name: gateway health
        run: curl -fsS http://localhost:9000/_health
      - name: S3 smoke test against the cluster
        run: bash scripts/smoke.sh http://localhost:9000
      - name: aws CLI smoke test against the cluster
        run: bash scripts/awscli-smoke.sh http://localhost:9000
      - name: smoke test with each metadata and storage node stopped
        run: bash scripts/failover-smoke.sh http://localhost:9000
      - name: demo (aws CLI with a storage node killed mid-upload)
        run: bash scripts/demo.sh http://localhost:9000
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
