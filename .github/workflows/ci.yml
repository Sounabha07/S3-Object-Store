name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, staticcheck, race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  cluster:
    name: docker-compose cluster smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build and start cluster
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 120
      - name: show status
        if: always()
        run: docker compose -f deploy/docker-compose.yml ps
      - name: gateway health
        run: curl -fsS http://localhost:9000/healthz
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
