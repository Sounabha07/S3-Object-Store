# Full local cluster: 3 metadata (Raft) nodes, 6 storage nodes, 1 gateway.
# Usage: make up / make down   (or docker compose -f deploy/docker-compose.yml ...)
name: s3os

x-node: &node
  image: s3os:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped

x-meta: &meta
  <<: *node
  healthcheck:
    test: ["CMD", "/usr/local/bin/metadata", "-probe", "http://127.0.0.1:7000/_health"]
    interval: 2s
    timeout: 3s
    retries: 15

x-storage: &storage
  <<: *node
  healthcheck:
    test: ["CMD", "/usr/local/bin/storage", "-probe", "http://127.0.0.1:8000/_health"]
    interval: 2s
    timeout: 3s
    retries: 15

# Static Raft membership, identical on every metadata node: id@raftaddr@httpurl.
x-peers: &peers "meta-1@meta-1:7001@http://meta-1:7000,meta-2@meta-2:7001@http://meta-2:7000,meta-3@meta-3:7001@http://meta-3:7000"

services:
  meta-1:
    <<: *meta
    command: ["metadata", "-id", "meta-1", "-listen", ":7000", "-raft-bind", ":7001", "-data", "/data", "-peers", *peers]
    volumes: [meta-1:/data]
  meta-2:
    <<: *meta
    command: ["metadata", "-id", "meta-2", "-listen", ":7000", "-raft-bind", ":7001", "-data", "/data", "-peers", *peers]
    volumes: [meta-2:/data]
  meta-3:
    <<: *meta
    command: ["metadata", "-id", "meta-3", "-listen", ":7000", "-raft-bind", ":7001", "-data", "/data", "-peers", *peers]
    volumes: [meta-3:/data]

  storage-1:
    <<: *storage
    command: ["storage", "-id", "storage-1", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-1:/data]
  storage-2:
    <<: *storage
    command: ["storage", "-id", "storage-2", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-2:/data]
  storage-3:
    <<: *storage
    command: ["storage", "-id", "storage-3", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-3:/data]
  storage-4:
    <<: *storage
    command: ["storage", "-id", "storage-4", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-4:/data]
  storage-5:
    <<: *storage
    command: ["storage", "-id", "storage-5", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-5:/data]
  storage-6:
    <<: *storage
    command: ["storage", "-id", "storage-6", "-listen", ":8000", "-data", "/data"]
    volumes: [storage-6:/data]

  gateway:
    <<: *node
    # M2: metadata in the Raft cluster; shards still on the gateway's volume
    # until storage nodes take over in M3.
    command: ["gateway", "-listen", ":9000", "-data", "/data", "-meta", "http://meta-1:7000,http://meta-2:7000,http://meta-3:7000"]
    ports: ["9000:9000"]
    volumes: [gateway:/data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-probe", "http://127.0.0.1:9000/_health"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      meta-1: {condition: service_healthy}
      meta-2: {condition: service_healthy}
      meta-3: {condition: service_healthy}
      storage-1: {condition: service_healthy}
      storage-2: {condition: service_healthy}
      storage-3: {condition: service_healthy}
      storage-4: {condition: service_healthy}
      storage-5: {condition: service_healthy}
      storage-6: {condition: service_healthy}

volumes:
  gateway:
  meta-1:
  meta-2:
  meta-3:
  storage-1:
  storage-2:
  storage-3:
  storage-4:
  storage-5:
  storage-6:
